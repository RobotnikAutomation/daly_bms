---
name: Deb generator
# author: "Guillem Gari <ggari@robotnik.es>"
# description: "Creates container image and push it to the registry"

on:
  workflow_dispatch:

jobs:
  build:
    name: Generate the deb files artifacts
    runs-on:
      - self-hosted
      - internal-robotnik
      - linux
      - kubernetes
    steps:
      - uses: actions/checkout@v4
      - name: Login to Robotnik Registry
        uses: docker/login-action@v3
        with:
          registry: registry.robotnik.ws
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Transform GITHUB_REF_NAME to VERSION
        run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV
      - name: configure docker files
        run: |
          yq e '.images.version = env(VERSION)' -i setup-container.yaml
          setup-container/scripts/setup.sh
      - name: Obtain deb files
        run: |
          chmod 777 container/debs
          cd container/debs
          docker compose up --build
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: container/debs/
